name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, unit/integration tests, evals
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Deterministic evals
        run: |
          node packages/cli/src/main.ts evals run --db :memory: --out dist/evals-report.json
      - name: CLI smoke (offline demo flow)
        run: node scripts/smoke.ts
      - uses: actions/upload-artifact@v4
        with:
          name: evals-report
          path: dist/evals-report.json

  website:
    name: Build website and admin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: website/dist

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [verify]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/e2e/report

  supply-chain:
    name: Dependency audit, licences, SBOM, secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # gitleaks-action, on a pull_request event, lists the PR's commits via the
      # GitHub API to scope its scan; without this it fails closed with 403
      # "Resource not accessible by integration" rather than silently skipping.
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency vulnerabilities (fails on high/critical)
        run: pnpm audit --audit-level=high
      - name: Licence allow-list
        run: node scripts/licenses.ts
      - name: SBOM (CycloneDX 1.5)
        run: node scripts/sbom.ts --out dist/sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: dist/sbom.cdx.json
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: Static analysis (CodeQL, Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      # codeql-action/analyze looks up the current workflow run (for status/telemetry
      # reporting) via the GitHub API after the scan itself completes; without this,
      # that lookup returns 403 and the action reports "configuration error" even
      # though the scan and its SARIF output succeeded.
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      # GitHub Advanced Security (which code scanning depends on for a private
      # repository) is not purchased on this account — the analyze step fails with
      # "Code scanning is not enabled for this repository" for that reason alone,
      # not because of a finding. Non-blocking until GHAS is purchased or the repo
      # is made public; Semgrep below is the enforced, always-available SAST gate.
      - uses: github/codeql-action/analyze@v3
        continue-on-error: true
      - name: Semgrep
        run: |
          python3 -m pip install --quiet semgrep==1.*
          semgrep scan --config p/typescript --config p/nodejs --config p/secrets --error --exclude node_modules --exclude dist
